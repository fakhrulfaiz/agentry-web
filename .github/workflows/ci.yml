# Checks for agentry-web.
#   push to develop          typecheck + unit/component tests (fast feedback on every change)
#   pull request to main     the same, then Playwright e2e against the mock API, a Docker build,
#                            and a check that package.json names a version not yet released
# The image is published to GHCR only after the merge (see publish.yml).
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version not yet released
    # A develop → main merge is a release: package.json must name a version without a tag.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check package.json version against the release tags
        run: |
          version=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error file=package.json::Version $version is already released (tag v$version). Bump it on develop: npm version minor --no-git-tag-version (or patch / major / an exact version)."
            exit 1
          fi
          if ! scripts/ci/release-notes.sh "$version" | grep -q .; then
            echo "::warning file=CHANGELOG.md::No \"## $version\" section in CHANGELOG.md; the release notes will be generated from the commits."
          fi
          echo "Releasing $version on merge." >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next-env.d.ts and the route types are generated, not committed.
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      # Timing-sensitive component specs are flaky under full-file parallelism.
      - run: pnpm exec vitest run --no-file-parallelism

  e2e:
    name: End-to-end (Playwright)
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Starts the mock API (4019) and next dev (3019) itself; see playwright.config.ts.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Docker image builds
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
